<!doctype html>
<html lang="es" data-route="name">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // En la ruta con nombre (servida por 404.html en GitHub Pages) la URL es
    // /<repo>/<Nombre>, así que las rutas relativas necesitan una <base> que
    // apunte a la raíz del proyecto. En index.html no hace nada.
    (function () {
      if (document.documentElement.getAttribute("data-route") !== "name") return;
      var segments = location.pathname.split("/").filter(Boolean);
      // Sitio de proyecto en *.github.io: la raíz es el primer segmento (/repo/).
      // En cualquier otro caso: todo menos el último segmento (el nombre).
      var isProjectSite = /\.github\.io$/i.test(location.hostname) && segments.length > 1;
      var depth = isProjectSite ? 1 : Math.max(segments.length - 1, 0);
      var base = document.createElement("base");
      base.href = "/" + segments.slice(0, depth).map(function (s) { return s + "/"; }).join("");
      document.head.appendChild(base);
    })();
  </script>
  <title>Recupérate pronto 🌷</title>
  <meta name="description" content="Una pequeña tarjeta digital con buenos deseos para tu recuperación.">
  <meta name="theme-color" content="#FFF8F5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/tailwind.css">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <!-- Capa decorativa: las flores se generan en main.js -->
  <div class="flower-layer" id="flowerLayer" aria-hidden="true"></div>

  <main class="stage">
    <!-- Pantalla inicial -->
    <section class="welcome-screen container d-flex flex-column align-items-center justify-content-center text-center min-vh-100" id="welcomeScreen" aria-labelledby="welcomeTitle">
      <div class="card-soft tw-w-full tw-max-w-lg tw-px-6 tw-py-10 sm:tw-px-10 sm:tw-py-12">
        <span class="welcome-icon tw-block tw-mb-3" aria-hidden="true">🌷</span>
        <h1 class="title-serif tw-mb-4" id="welcomeTitle">Recupérate pronto</h1>
        <p class="text-soft tw-mb-8 tw-leading-relaxed">
          Un pequeño mensaje para recordarte que cada día trae nuevas razones para sonreír.
        </p>
        <button type="button" class="btn btn-bloom welcome-button" id="startExperience">
          Abrir mensaje <span aria-hidden="true">✨</span>
        </button>
      </div>
    </section>

    <!-- Mensaje principal: se revela tras el clic -->
    <section class="main-content container d-flex flex-column align-items-center justify-content-center text-center min-vh-100" id="mainContent" aria-labelledby="mainTitle" hidden>
      <div class="tw-w-full tw-max-w-xl tw-py-12">
        <p class="name-card tw-inline-flex tw-items-center tw-gap-3 tw-mb-8 tw-px-6 tw-py-3 sm:tw-px-8" id="nameCard" hidden>
          <span aria-hidden="true">🌷</span>
          <span>Para <strong class="name-text" id="nameText"></strong></span>
          <span aria-hidden="true">🌷</span>
        </p>

        <div class="card-soft message-card tw-px-6 tw-py-10 sm:tw-px-12 sm:tw-py-12">
          <h2 class="title-serif tw-mb-5" id="mainTitle" tabindex="-1">Recupérate pronto</h2>
          <p class="message text-soft tw-leading-relaxed tw-mb-2">Hay días para correr y días para descansar.</p>
          <p class="message text-soft tw-leading-relaxed tw-mb-8">Hoy toca respirar, cuidarte y darte tiempo.</p>

          <blockquote class="quote tw-mb-8 tw-mx-auto tw-max-w-sm">
            <p class="tw-m-0" id="quoteText">“Cada día es un pequeño paso hacia sentirte mejor.”</p>
          </blockquote>

          <p class="signature tw-m-0">Con mucho cariño <span aria-hidden="true">💛</span></p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
